<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8"/>
	<title>En formes</title>
	<link rel="stylesheet" href="./css/style.css"/>
	<script type="module">
		import App from "./src/App.js";
	</script>
</head>
<body>
	<div id="interface">
		<header><h1>En formes</h1></header>
		<div class="body" id="app">
			<form id="formes" action="" onsubmit="return false;">
				<div>
					<label for="inCaractere">Caractère</label>
					<input type="text" name="inCaractere" id="inCaractere" size="3" value="*">
				</div>
				<div>
					<label for="inTaille">Taille</label>
					<input type="number" name="inTaille" id="inTaille" min="3" max="50" value="5">
				</div>
				<div>
					<button id="btnDessiner" type="submit">Dessiner</button>
				</div>
			</form>
			<div id="resultat"></div>
		</div>
		<footer><span>&copy; TIM </span><strong>En formes</strong></footer>
	</div>
</body>
</html>
